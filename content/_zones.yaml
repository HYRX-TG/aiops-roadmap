zones:
  - id: "foundations"
    title: "基础：代码与计算机"
    title_en: "Foundations: Code & Computers"
    coreQuestion: "代码到底是什么？"
    description: "从零开始。理解代码是什么、计算机如何执行它，并掌握每位工程师每天都会用到的基础工具。"
    color: "#10b981"
    position: { x: 0, y: 0 }
    active: true

  - id: "building"
    title: "构建真实软件"
    title_en: "Building Real Software"
    coreQuestion: "让我来做点真正的东西"
    description: "从脚本走向真正的应用。学习 Web 服务、数据库、API，以及把它们组合在一起的整体架构。"
    color: "#3b82f6"
    position: { x: 400, y: 0 }
    active: true

  - id: "networking"
    title: "网络与互联网"
    title_en: "Networking & the Internet"
    coreQuestion: "怎么把它放到互联网上？"
    description: "理解数据如何在网络中传输——协议、寻址、路由，以及加密基础。"
    color: "#8b5cf6"
    position: { x: 800, y: 0 }
    active: true

  - id: "running"
    title: "运行你的应用"
    title_en: "Running Your App"
    coreQuestion: "我到底该怎么运行这东西？"
    description: "从理解网络走向在真实服务器上运行你的应用——服务器、云、DNS、HTTPS，以及一次真实的部署。"
    color: "#f97316"
    position: { x: 400, y: 350 }
    active: true

  - id: "scaling"
    title: "扩展与可靠性"
    title_en: "Scaling & Reliability"
    coreQuestion: "用户越来越多了"
    description: "一台服务器不够用了。学习负载均衡、复制、CDN，以及分布式系统的基础。"
    color: "#f59e0b"
    position: { x: 0, y: 750 }
    active: true

  - id: "delivery"
    title: "交付与自动化"
    title_en: "Delivery & Automation"
    coreQuestion: "手动部署太痛苦了"
    description: "CI/CD 流水线、基础设施即代码（IaC）与自动化部署。把服务器周边的一切都自动化——测试、构建、发布，不再手工操作。"
    color: "#ef4444"
    position: { x: 400, y: 750 }
    active: true

  - id: "containers"
    title: "容器"
    title_en: "Containers"
    coreQuestion: "我怎么打包并发布我的应用？"
    description: "用 Docker 把应用容器化，在 CI 中构建镜像、存到镜像仓库，并在服务器上运行。它是一切上层能力的基础。"
    color: "#14b8a6"
    position: { x: 800, y: 1150 }
    active: true

  - id: "kubernetes"
    title: "Kubernetes"
    title_en: "Kubernetes"
    coreQuestion: "我怎么大规模运行容器？"
    description: "从 Pod 到生产。学习 Kubernetes 的工作原理、如何在其上部署和运维应用，在把它推向生产之前建立扎实的心智模型。"
    color: "#6366f1"
    position: { x: 200, y: 1150 }
    active: true

  - id: "kubernetes-production"
    title: "生产级 Kubernetes"
    title_en: "Kubernetes in Production"
    coreQuestion: "我怎么用 Kubernetes 跑真实业务？"
    description: "把 Kubernetes 带入生产。Helm、基于 ArgoCD 的 GitOps、容器 CI/CD 流水线、多环境晋级与密钥管理。"
    color: "#a855f7"
    position: { x: 400, y: 1550 }
    active: true

  - id: "observability"
    title: "可观测性与安全"
    title_en: "Observability & Security"
    coreQuestion: "我怎么知道它健康吗？"
    description: "日志、指标、链路追踪、告警。外加安全基础——密钥管理、IAM 与合规。"
    color: "#06b6d4"
    position: { x: 0, y: 1950 }
    active: true

  - id: "sre"
    title: "SRE 站点可靠性工程"
    title_en: "SRE & Reliability"
    coreQuestion: "我怎么专业地做这件事？"
    description: "SRE 理念、SLO、事故管理、混沌工程，以及打造其他工程师会喜欢的平台。"
    color: "#ec4899"
    position: { x: 500, y: 1950 }
    active: true

  - id: "aiops"
    title: "AIOps 智能运维"
    title_en: "AIOps"
    coreQuestion: "怎么让 AI 帮我运维？"
    description: "在 SRE 与可观测性之上，构建由大模型驱动的智能运维闭环：监控接入、根因分析（RCA）、执行护栏与多智能体编排。本分区是本项目自研的核心。"
    color: "#0d9488"
    position: { x: 900, y: 1950 }
    active: true

  - id: "self-hosting"
    title: "自托管"
    title_en: "Self-Hosting"
    coreQuestion: "我想跑属于自己的服务"
    description: "在自己的硬件上搭建文件同步、媒体中心、智能家居中枢等等——隐私优先、没有订阅、一个永远挖不完的坑。"
    color: "#0ea5e9"
    position: { x: 850, y: 750 }
    active: true

